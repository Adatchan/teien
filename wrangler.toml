name = "teien-ticket"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 画面（HTML）は public/ から配信。/api/* だけ Worker が処理する
[assets]
directory = "./public"

# 取り置き・当日券のデータの保存先（Cloudflare D1）
# 自分の Cloudflare で動かすときは `npx wrangler d1 create teien-ticket --location apac` で作り、表示された database_id に書き換えてください
[[d1_databases]]
binding = "DB"
database_name = "teien-ticket"
database_id = "f30a44ec-f6a2-4444-a4e6-973e3a00b162"

# パスワードは secret で設定します（このファイルには書かない）
#   npx wrangler secret put ADMIN_PASSWORD    （レジ・受付用）
#   npx wrangler secret put MASTER_PASSWORD   （管理画面用）
# ローカル開発時は .dev.vars に ADMIN_PASSWORD=xxxx と書く
